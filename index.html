<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How Well Do You Know Arti?</title>
<style>
  :root { color-scheme: dark; --bg:#09090f; --panel:#14141f; --panel2:#1c1c2a; --text:#f7f4ff; --muted:#aaa5bd; --pink:#ff4f9a; --purple:#9b6bff; --good:#5be0a0; --bad:#ff6b79; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(ellipse at top, #271432 0%, #11101b 42%, var(--bg) 78%); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .app { width:min(100%,650px); }
  .topline { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:.82rem; letter-spacing:.12em; text-transform:uppercase; margin-bottom:14px; }
  .pill { border:1px solid #393248; border-radius:999px; padding:7px 11px; }
  .card { background:linear-gradient(145deg,rgba(28,25,42,.97),rgba(17,17,27,.98)); border:1px solid #393047; border-radius:26px; padding:clamp(22px,5vw,38px); box-shadow:0 24px 80px #0007; }
  .eyebrow { color:var(--pink); text-transform:uppercase; font-size:.78rem; font-weight:800; letter-spacing:.17em; }
  h1 { font-size:clamp(2.2rem,7vw,3.5rem); line-height:1.02; margin:13px 0; letter-spacing:-.055em; }
  h1 span { color:var(--pink); }
  .intro { color:var(--muted); line-height:1.65; margin:0 0 24px; }
  .progress { height:6px; background:#30283b; border-radius:20px; overflow:hidden; margin:22px 0 28px; }
  .progress > div { height:100%; width:0; background:linear-gradient(90deg,var(--pink),var(--purple)); transition:width .25s ease; }
  .question { font-size:clamp(1.3rem,4vw,1.75rem); line-height:1.25; margin:0 0 9px; }
  .hint { color:var(--muted); font-size:.9rem; margin:0 0 20px; }
  .answers { display:grid; gap:11px; }
  .answer { text-align:left; border:1px solid #3b344b; border-radius:14px; padding:15px 17px; background:var(--panel2); color:var(--text); font:inherit; font-weight:650; cursor:pointer; transition:transform .15s,border-color .15s,background .15s; display:flex; gap:12px; align-items:center; }
  .answer:hover:not(:disabled) { transform:translateY(-2px); border-color:var(--pink); background:#2a2033; }
  .answer .letter { display:grid; place-items:center; flex:0 0 30px; height:30px; border-radius:9px; background:#332940; color:#e5b8d0; font-size:.8rem; }
  .answer.selected { border-color:var(--purple); background:#302341; }
  .answer.correct { border-color:var(--good); background:#173329; }
  .answer.wrong { border-color:var(--bad); background:#391e2b; }
  .answer:disabled { cursor:default; opacity:1; }
  .feedback { min-height:26px; margin:14px 0 0; color:var(--muted); font-size:.92rem; line-height:1.5; }
  .actions { display:flex; gap:10px; justify-content:space-between; align-items:center; margin-top:22px; }
  .small { color:var(--muted); font-size:.85rem; }
  .primary { border:0; border-radius:13px; padding:13px 19px; color:white; font:inherit; font-weight:800; background:linear-gradient(100deg,var(--pink),var(--purple)); cursor:pointer; }
  .primary:disabled { opacity:.4; cursor:not-allowed; }
  .result { text-align:center; }
  .emoji { font-size:3.5rem; margin-bottom:8px; }
  .score { font-size:4rem; font-weight:900; letter-spacing:-.06em; margin:15px 0 4px; background:linear-gradient(90deg,#ff6aaa,#b49aff); color:transparent; background-clip:text; }
  .result p { color:var(--muted); line-height:1.65; }
  .result .primary { margin-top:14px; }
  .footer { text-align:center; color:#777187; font-size:.78rem; margin-top:17px; }
  .hidden { display:none; }
  @media (max-width:440px) { body{padding:14px} .card{border-radius:20px} .actions{align-items:flex-end} }
</style>
</head>
<body>
<main class="app">
  <div class="topline"><span>✦ The Arti Quiz</span><span class="pill" id="counter">Ready?</span></div>
  <section class="card" id="startScreen">
    <div class="eyebrow">The ultimate test</div>
    <h1>How well do you know <span>Arti?</span></h1>
    <p class="intro">Five questions. No cheating. Let's see who really knows him. 👀</p>
    <button class="primary" id="startBtn">Start the quiz →</button>
  </section>
  <section class="card hidden" id="quizScreen">
    <div class="eyebrow" id="category">Question 1</div>
    <div class="progress"><div id="progressBar"></div></div>
    <h2 class="question" id="questionText"></h2>
    <p class="hint" id="hintText"></p>
    <div class="answers" id="answers"></div>
    <p class="feedback" id="feedback" aria-live="polite"></p>
    <div class="actions">
      <span class="small" id="selectionNote">Choose your answer</span>
      <button class="primary" id="nextBtn" disabled>Next →</button>
    </div>
  </section>
  <section class="card result hidden" id="resultScreen">
    <div class="emoji" id="resultEmoji">🏆</div>
    <div class="eyebrow">Quiz complete</div>
    <h1 id="resultTitle">You know Arti!</h1>
    <div class="score" id="scoreText">0/5</div>
    <p id="resultMessage"></p>
    <button class="primary" id="restartBtn">Play again ↻</button>
  </section>
  <div class="footer">Made for fun • How well do YOU know Arti?</div>
</main>
<script>
const questions = [
  {
    text: "What kind of person is Arti?",
    hint: "Choose one answer.",
    multi: false,
    options: ["Hard fucker", "Play boy", "Loyal"],
    correct: [0],
    explanation: "You know the answer 😏"
  },
  {
    text: "What kind of girls does Arti like?",
    hint: "Choose all that apply.",
    multi: true,
    options: ["Hoes", "Latinas", "Housewives", "Party girls"],
    correct: [1, 2],
    explanation: "It's housewives and Latinas. 💋"
  },
  {
    text: "What's Arti's favourite position?",
    hint: "Choose one answer.",
    multi: false,
    options: ["Doggy style", "Cowgirl", "69", "All of the above"],
    correct: [3],
    explanation: "All of the above. 😅"
  },
  {
    text: "What's more important to Arti in a woman?",
    hint: "Choose one answer.",
    multi: false,
    options: ["Brain", "Face", "Body"],
    correct: [0],
    explanation: "Brains over everything. 🧠"
  },
  {
    text: "What does Arti love to be called?",
    hint: "Choose all that apply.",
    multi: true,
    options: ["Daddy", "Papi", "Papasito", "Zemer", "Shpirt", "Jet", "Bot", "Drit"],
    correct: [0, 1, 2],
    explanation: "Daddy, Papi and Papasito. ❤️"
  }
];
let current = 0, score = 0, selected = new Set(), locked = false;
const $ = id => document.getElementById(id);
const startScreen = $("startScreen"), quizScreen = $("quizScreen"), resultScreen = $("resultScreen");

$("startBtn").addEventListener("click", () => {
  current = 0; score = 0;
  startScreen.classList.add("hidden");
  resultScreen.classList.add("hidden");
  quizScreen.classList.remove("hidden");
  renderQuestion();
});
function renderQuestion() {
  locked = false; selected = new Set();
  const q = questions[current];
  $("counter").textContent = `${current + 1} / ${questions.length}`;
  $("category").textContent = `Question ${current + 1} of ${questions.length}`;
  $("progressBar").style.width = `${current / questions.length * 100}%`;
  $("questionText").textContent = q.text;
  $("hintText").textContent = q.hint;
  $("feedback").textContent = "";
  $("selectionNote").textContent = q.multi ? "Select all that apply" : "Choose one answer";
  $("nextBtn").disabled = true;
  $("nextBtn").textContent = current === questions.length - 1 ? "See results →" : "Next →";
  const container = $("answers");
  container.innerHTML = "";
  q.options.forEach((option, index) => {
    const button = document.createElement("button");
    button.className = "answer";
    button.type = "button";
    button.innerHTML = `<span class="letter">${String.fromCharCode(65 + index)}</span><span></span>`;
    button.lastElementChild.textContent = option;
    button.addEventListener("click", () => choose(index));
    container.appendChild(button);
  });
}
function choose(index) {
  if (locked) return;
  const q = questions[current];
  if (q.multi) {
    selected.has(index) ? selected.delete(index) : selected.add(index);
    document.querySelectorAll(".answer").forEach((btn, i) => btn.classList.toggle("selected", selected.has(i)));
    $("nextBtn").disabled = selected.size === 0;
  } else {
    selected = new Set([index]);
    submitAnswer();
  }
}
function submitAnswer() {
  if (locked || selected.size === 0) return;
  locked = true;
  const q = questions[current];
  const isCorrect = selected.size === q.correct.length && q.correct.every(i => selected.has(i));
  if (isCorrect) score++;
  document.querySelectorAll(".answer").forEach((btn, i) => {
    btn.disabled = true;
    if (q.correct.includes(i)) btn.classList.add("correct");
    else if (selected.has(i)) btn.classList.add("wrong");
  });
  $("feedback").textContent = (isCorrect ? "✓ Correct! " : "Not quite! ") + q.explanation;
  $("selectionNote").textContent = isCorrect ? "You got it!" : "Answer revealed";
  $("nextBtn").disabled = false;
  $("progressBar").style.width = `${(current + 1) / questions.length * 100}%`;
}
$("nextBtn").addEventListener("click", () => {
  if (!locked) { submitAnswer(); return; }
  current++;
  if (current < questions.length) renderQuestion();
  else showResults();
});
function showResults() {
  quizScreen.classList.add("hidden");
  resultScreen.classList.remove("hidden");
  $("counter").textContent = "Finished";
  $("scoreText").textContent = `${score}/${questions.length}`;
  let emoji, title, message;
  if (score === 5) {
    emoji = "👑"; title = "Arti expert!";
    message = "Perfect score! You know Arti way too well. Nobody can beat you.";
  } else if (score >= 3) {
    emoji = "🔥"; title = "You know your stuff!";
    message = "Not bad at all — you know quite a bit about Arti. Try again for a perfect score.";
  } else {
    emoji = "😭"; title = "Do you even know Arti?";
    message = "Looks like you need to get to know Arti a little better. Run it back!";
  }
  $("resultEmoji").textContent = emoji;
  $("resultTitle").textContent = title;
  $("resultMessage").textContent = message;
}
$("restartBtn").addEventListener("click", () => {
  current = 0; score = 0;
  resultScreen.classList.add("hidden");
  quizScreen.classList.remove("hidden");
  renderQuestion();
});
</script>
</body>
</html>
